<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chloe Assist 초기화</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #4f46e5;
      --line: #e5e7eb;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #eef2ff 0%, var(--bg) 55%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    .card {
      width: min(560px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      padding: 28px;
    }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { margin: 0 0 12px; color: var(--muted); line-height: 1.7; }
    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .danger { color: var(--danger); font-weight: 700; }
    .done {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border: 0;
      cursor: pointer;
    }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .cancel { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .reset { background: var(--danger); }
    .done[hidden], .actions[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>데이터 초기화</h1>
    <p>초기화를 누르면 프로젝트, 할 일, 리뷰, 제품 설계, 이슈와 루틴 데이터를 모두 지웁니다.</p>
    <p>데이터 파일은 <code>/Users/leehyunhye/Documents/chloeassist/data/chloeassist-data.json</code> 입니다.</p>
    <p>저장된 로컬 AI 설정은 유지합니다.</p>
    <p class="danger">되돌릴 수 없습니다.</p>
    <div id="status" class="status">설정에서 데이터를 먼저 내보낸 뒤 초기화하는 것을 권장합니다.</div>
    <div id="actions" class="actions">
      <a class="done cancel" href="index.html?v=20260824t">취소</a>
      <button id="reset" class="done reset" type="button">모든 데이터 초기화</button>
    </div>
    <a id="back" class="done" href="index.html?v=20260824t" hidden>홈으로 돌아가기</a>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const backEl = document.getElementById('back');
    const actionsEl = document.getElementById('actions');
    const resetEl = document.getElementById('reset');

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function clearAppStorage(storage) {
      const keys = [];
      for (let index = 0; index < storage.length; index += 1) {
        const key = storage.key(index);
        if (key && key.startsWith('chloeassist:') && key !== 'chloeassist:config') keys.push(key);
      }
      keys.forEach((key) => storage.removeItem(key));
    }

    async function clearBrowserStorage() {
      try { clearAppStorage(localStorage); } catch {}
      try { clearAppStorage(sessionStorage); } catch {}
    }

    async function run() {
      setStatus('Chloe Assist 저장 데이터를 지우는 중...');
      actionsEl.hidden = true;
      await clearBrowserStorage();
      try {
        await fetch('/api/store', { method: 'DELETE' });
      } catch {}
      setStatus('초기화가 완료됐습니다.\n작업공간 데이터만 비웠고 로컬 AI 설정은 유지했습니다.');
      backEl.hidden = false;
    }

    resetEl.addEventListener('click', () => {
      if (!confirm('정말 모든 Chloe Assist 데이터를 지울까요?')) return;
      run().catch((err) => {
        setStatus(`초기화 중 오류가 발생했습니다.\n${err?.message || err}`);
        backEl.hidden = false;
      });
    });
  </script>
</body>
</html>
